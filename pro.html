<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><title>Unlock Pro | Scam Check PK</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E"><style>:root{--bg:#eef2f6;--ink:#12202e;--muted:#566474;--line:#d3dbe4;--btn:#12202e;--bt:#fff;--link:#0b57d0}@media (prefers-color-scheme:dark){:root{--bg:#0e141b;--ink:#e9eef3;--muted:#9aa8b6;--line:#2a3643;--btn:#e9eef3;--bt:#0e141b;--link:#8ab4f8}}*{box-sizing:border-box}body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);color:var(--ink);font:17px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}main{max-width:660px;margin:0 auto;padding:28px 18px 56px}h1{font-size:clamp(1.7rem,5.5vw,2.3rem);line-height:1.15;margin:0 0 14px;letter-spacing:-.02em}h2{font-size:1.15rem;margin:26px 0 6px}ul{padding-left:20px}li{margin:6px 0}a{color:var(--link)}.nav{display:flex;flex-wrap:wrap;gap:16px;margin:0 0 24px;font-size:.92rem}.cta{display:inline-block;margin-top:18px;padding:12px 22px;border-radius:10px;background:var(--btn);color:var(--bt);font-weight:700;text-decoration:none}.src,footer{color:var(--muted);font-size:.88rem}footer{margin-top:34px}.help{font-weight:700}a:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}input,select,button{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);max-width:100%}button{background:var(--btn);color:var(--bt);font-weight:700;border:0;cursor:pointer}button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.box{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:14px 0}.code{font-size:1.4rem;font-weight:700;letter-spacing:.04em;word-break:break-all}.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}.msg{min-height:1.4em}</style></head><body><main><nav class="nav"><a href="index.html">Check a message</a><a href="guides.html">Scam guides</a><a href="about.html">About</a><a href="help.html" class="help">Need help now</a><a href="privacy.html">Privacy</a></nav><h1>Unlock Pro</h1><p>Enter the personal code you received on WhatsApp. It works on a limited number of devices, so please keep it private.</p>
<form id="f" class="row"><input id="c" required maxlength="40" placeholder="SCPK-XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters"><button>Unlock</button></form>
<p id="msg" class="msg"></p><div id="st" class="box" hidden></div><div class="row"><button id="x" class="alt">Remove code from this device</button></div>
<p class="src">The Pro deep check is being added now. Your code will work as soon as it launches.</p></main><script>
const $=s=>document.querySelector(s);
let dev=localStorage.getItem('scpk_device');if(!dev){dev=crypto.randomUUID();localStorage.setItem('scpk_device',dev)}
const fd=s=>new Date(s*1000).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
async function call(p,code){try{const r=await fetch('/api/'+p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code,device_id:dev})});return await r.json()}catch(e){return{ok:false,message:'No connection. Try again.'}}}
function ok(r){$('#msg').textContent='';$('#st').hidden=false;$('#st').textContent='Pro is active on this device until '+fd(r.expires_at)+'. Checks used: '+r.used+' of '+r.limit+'.'}
async function go(p,code,keep){const r=await call(p,code);if(r.ok){localStorage.setItem('scpk_code',code);ok(r)}else{$('#st').hidden=true;$('#msg').textContent=r.message||'Something went wrong.';if(keep&&(r.error==='expired'||r.error==='invalid_code'))localStorage.removeItem('scpk_code')}}
$('#f').onsubmit=e=>{e.preventDefault();go('activate',$('#c').value.trim(),false)};
$('#x').onclick=()=>{localStorage.removeItem('scpk_code');$('#st').hidden=true;$('#msg').textContent='Code removed from this device.'};
const saved=localStorage.getItem('scpk_code');if(saved)go('status',saved,true);
</script></body></html>
