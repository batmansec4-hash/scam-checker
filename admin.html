<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><title>Admin | Scam Check PK</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%9B%A1%EF%B8%8F%3C/text%3E%3C/svg%3E"><style>:root{--bg:#eef2f6;--ink:#12202e;--muted:#566474;--line:#d3dbe4;--btn:#12202e;--bt:#fff;--link:#0b57d0}@media (prefers-color-scheme:dark){:root{--bg:#0e141b;--ink:#e9eef3;--muted:#9aa8b6;--line:#2a3643;--btn:#e9eef3;--bt:#0e141b;--link:#8ab4f8}}*{box-sizing:border-box}body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);color:var(--ink);font:17px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}main{max-width:660px;margin:0 auto;padding:28px 18px 56px}h1{font-size:clamp(1.7rem,5.5vw,2.3rem);line-height:1.15;margin:0 0 14px;letter-spacing:-.02em}h2{font-size:1.15rem;margin:26px 0 6px}ul{padding-left:20px}li{margin:6px 0}a{color:var(--link)}.nav{display:flex;flex-wrap:wrap;gap:16px;margin:0 0 24px;font-size:.92rem}.cta{display:inline-block;margin-top:18px;padding:12px 22px;border-radius:10px;background:var(--btn);color:var(--bt);font-weight:700;text-decoration:none}.src,footer{color:var(--muted);font-size:.88rem}footer{margin-top:34px}.help{font-weight:700}a:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}input,select,button{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);max-width:100%}button{background:var(--btn);color:var(--bt);font-weight:700;border:0;cursor:pointer}button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.box{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:14px 0}.code{font-size:1.4rem;font-weight:700;letter-spacing:.04em;word-break:break-all}.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}.msg{min-height:1.4em}</style></head><body><main><nav class="nav"><a href="index.html">Check a message</a><a href="guides.html">Scam guides</a><a href="about.html">About</a><a href="help.html" class="help">Need help now</a><a href="privacy.html">Privacy</a></nav><h1>Admin</h1>
<div id="login"><p>Enter the admin passphrase.</p><form id="lform" class="row"><input id="pw" type="password" autocomplete="current-password" required placeholder="Passphrase"><button>Sign in</button></form><p id="lmsg" class="msg"></p></div>
<div id="panel" hidden><div class="row"><button id="out" class="alt">Sign out</button></div>
<h2>Issue a code</h2><p>Only after you have confirmed the payment in your own JazzCash app.</p>
<form id="iform" class="row"><select id="plan"><option value="pro">Pro</option><option value="business">Business</option></select><input id="label" required maxlength="60" placeholder="Customer name or shop"><button>Issue code</button></form><p id="imsg" class="msg"></p>
<div id="new" class="box" hidden><p>Shown once. Send it now.</p><div id="ncode" class="code"></div><textarea id="nmsg" rows="4" style="width:100%;margin-top:8px"></textarea><div class="row"><button id="copy">Copy message</button><a id="wa" class="cta" style="margin:0" target="_blank" rel="noopener">Open WhatsApp</a></div></div>
<h2>Codes</h2><div class="tw"><table><thead><tr><th>Customer</th><th>Plan</th><th>Status</th><th>Expires</th><th>Devices</th><th>Checks</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>
const $=s=>document.querySelector(s);let pass=sessionStorage.getItem('scpk_admin')||'';
async function api(p,b){try{const r=await fetch('/api/admin/'+p,{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+pass},body:JSON.stringify(b||{})});return await r.json()}catch(e){return{ok:false,message:'Network error'}}}
const fd=s=>new Date(s*1000).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
function show(on){$('#login').hidden=on;$('#panel').hidden=!on}
async function load(){const r=await api('list');if(!r.ok){pass='';sessionStorage.removeItem('scpk_admin');show(false);$('#lmsg').textContent=r.message||'Failed';return}
show(true);const tb=$('#rows');tb.textContent='';
for(const c of r.codes){const live=c.status==='active'&&c.expires_at>r.now;const tr=document.createElement('tr');
[c.label,c.plan,live?'active':(c.status==='revoked'?'revoked':'expired'),fd(c.expires_at),c.devices+'/'+c.max_devices,c.used+'/'+c.monthly_limit].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});
const td=document.createElement('td');
const rn=document.createElement('button');rn.className='alt';rn.textContent='Renew';rn.onclick=()=>act('renew',c.id,c.label);td.appendChild(rn);td.append(' ');
if(live){const rv=document.createElement('button');rv.className='alt';rv.textContent='Revoke';rv.onclick=()=>{if(confirm('Revoke code for '+c.label+'?'))act('revoke',c.id)};td.appendChild(rv)}
tr.appendChild(td);tb.appendChild(tr)}}
function showCode(r){const url=location.origin+'/pro.html';const m='Your Scam Check PK Pro code: '+r.code+'\nOpen '+url+' and enter it. Valid until '+fd(r.expires_at)+'. Keep it private: it works on '+(r.plan==='business'?5:2)+' devices.';
$('#new').hidden=false;$('#ncode').textContent=r.code;$('#nmsg').value=m;$('#wa').href='https://wa.me/?text='+encodeURIComponent(m)}
async function act(p,id){const r=await api(p,{id});if(!r.ok){alert(r.message||'Failed');return}if(r.code)showCode(r);load()}
$('#lform').onsubmit=e=>{e.preventDefault();pass=$('#pw').value;sessionStorage.setItem('scpk_admin',pass);$('#pw').value='';load()};
$('#iform').onsubmit=async e=>{e.preventDefault();const r=await api('issue',{plan:$('#plan').value,label:$('#label').value});$('#imsg').textContent=r.ok?'':(r.message||'Failed');if(r.ok){showCode(r);$('#label').value='';load()}};
$('#copy').onclick=()=>{navigator.clipboard.writeText($('#nmsg').value);$('#copy').textContent='Copied'};
$('#out').onclick=()=>{sessionStorage.removeItem('scpk_admin');pass='';show(false)};
if(pass)load();
</script></body></html>
